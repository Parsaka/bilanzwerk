[project]
name = "bilanzwerk"
version = "0.1.0"
description = "Financial reporting and early-warning platform on official company filings (SEC, ESEF, GLEIF, ECB)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Parsa Kamali" }]
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "requests>=2.32",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.8,<1.10", "dbt-duckdb>=1.8,<1.10", "dbt-fabric>=1.8,<1.10"]
mdm = ["splink>=4.0,<5"]
analysis = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "shap>=0.46",
    "mlflow-skinny>=2.16",
    "matplotlib>=3.9",
]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.6", "sqlfluff>=3.2", "sqlfluff-templater-dbt>=3.2", "responses>=0.25", "openpyxl>=3.1"]

[project.scripts]
bilanzwerk = "ingestion.cli:app"
bw-analysis = "analysis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "mdm", "analysis"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "mdm/tests", "analysis/tests"]
addopts = "-q"
