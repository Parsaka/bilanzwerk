# Semantic model definition, rendered to TMDL by tools/generate_tmdl.py.
# Columns come from docs/data-contracts (one source of truth with the marts); this file adds
# relationships, measures, calculation groups, field parameters, RLS and OLS.

name: Bilanzwerk
culture: de-DE
warehouse_schema: marts

tables:
  dim_company: {hidden_columns: [valid_from, valid_to, version_number, match_probability, n_ciks, last_accepted_at, is_financial], key: company_key, description: "Golden record je Unternehmen (SCD Typ 2 auf Name und Sektor)."}
  dim_period: {hidden_columns: [company_id, first_filing, sec_fiscal_year, sec_fiscal_period, fye_month], key: period_key, description: "Geschäftsperioden je Unternehmen mit Veröffentlichungsverzug."}
  dim_date: {key: date_key, mark_as_date: true, description: "Kalender für Stichtage, Ereignisse und Periodenenden."}
  dim_line_item: {key: line_item_key, description: "Positionen: Bilanz, GuV, Cashflow mit Hierarchie."}
  dim_kpi: {key: kpi_key, description: "Kennzahlen-Glossar: Formel, Einheit, Richtung, Schwellen, Owner."}
  dim_scenario: {key: scenario_key, description: "Ist, Plan (im Januar eingefroren), Forecast."}
  dim_sector: {key: sector_key, description: "11 Sektoren mit SIC-Bereichen und NACE-Abschnitten."}
  dim_currency: {key: currency_key, description: "ISO-Währungen."}
  fact_financial_line: {hidden_columns: [company_id, available_at, source_filing], description: "Finanzzeilen je Unternehmen, Periode, Position, Szenario und Version.", large: true}
  fact_kpi: {hidden_columns: [company_id, available_at], description: "Kennzahlen mit Sektorperzentil, Veränderung und roter Flagge."}
  fact_event: {hidden_columns: [company_id, event_key, accepted_at], description: "Insolvenz (8-K Item 1.03), Delisting, Deregistrierung, Fristverlängerung."}
  fact_wc_opportunity: {hidden_columns: [company_id, sector_key], description: "Working-Capital-Potenzial gegen den Sektormedian in EUR."}
  fact_risk_score: {hidden_columns: [company_id, risk_score_key, run_id], description: "Insolvenzwahrscheinlichkeit 12 Monate je Unternehmen, Stichtag und Modell."}
  fact_data_quality: {hidden_columns: [run_id], description: "Datenqualitäts-Scorecard je Lauf, Regel und Tabelle."}
  fact_stewardship_queue: {description: "Offene Stewardship-Fälle der Stammdaten (Kandidatenpaare zur Prüfung)."}
  fact_hypothesis_result: {hidden_columns: [run_id, data_version], description: "H1–H4, wie der letzte Modelllauf sie entschieden hat (analysis/answer.json)."}
  fact_model_backtest: {hidden_columns: [run_id, data_version], description: "Gepoolter Out-of-time-Backtest je Modell (PR-AUC, Recall Top 5 %, Brier)."}
  fact_lead_time: {hidden_columns: [company_id, run_id], description: "H1: Vorlaufzeit der CCC- und Z''-Flagge je Unternehmen mit Insolvenz."}
  fact_case_study: {hidden_columns: [company_id, run_id], description: "Die drei Fallstudien (feste Auswahlregel, analysis/pipeline.py)."}
  sector_team_users: {schema: reference, hidden: true, description: "RLS-Zuordnung Benutzer zu Sektoren.", columns: [{name: user_principal_name, type: string}, {name: sector_code, type: string}]}

relationships:
  - [fact_financial_line.company_key, dim_company.company_key]
  - [fact_financial_line.period_key, dim_period.period_key]
  - [fact_financial_line.period_end_date, dim_date.date_key]
  - [fact_financial_line.line_item_key, dim_line_item.line_item_key]
  - [fact_financial_line.scenario_key, dim_scenario.scenario_key]
  - [fact_financial_line.currency_key, dim_currency.currency_key]
  - [fact_kpi.company_key, dim_company.company_key]
  - [fact_kpi.period_key, dim_period.period_key]
  - [fact_kpi.period_end_date, dim_date.date_key]
  - [fact_kpi.kpi_key, dim_kpi.kpi_key]
  - [fact_event.company_key, dim_company.company_key]
  - [fact_event.event_date, dim_date.date_key]
  - [fact_wc_opportunity.company_key, dim_company.company_key]
  - [fact_wc_opportunity.period_end_date, dim_date.date_key]
  - [fact_risk_score.company_key, dim_company.company_key]
  - [fact_risk_score.as_of_date, dim_date.date_key]
  - [dim_company.sector_key, dim_sector.sector_key]
  - [fact_lead_time.company_key, dim_company.company_key]
  # single direction like every other relationship (BPA rule); page 8 reaches the other facts
  # through the [Fall ...] measures, which apply the picked case with TREATAS
  - [fact_case_study.company_key, dim_company.company_key]

measures:
  - table: fact_case_study
    name: "Fall Z'' Score"
    folder: "Fallstudien"
    format: "0.00"
    description: "Z'' Score der gewählten Fallstudie (Filter über das Unternehmen, ohne beidseitige Beziehung)."
    expression: |
      CALCULATE ( [Z'' Score], TREATAS ( VALUES ( fact_case_study[company_id] ), dim_company[company_id] ) )

  - table: fact_case_study
    name: "Fall CCC"
    folder: "Fallstudien"
    format: "0.0"
    description: "CCC der gewählten Fallstudie (Filter über das Unternehmen, ohne beidseitige Beziehung)."
    expression: |
      CALCULATE ( [CCC], TREATAS ( VALUES ( fact_case_study[company_id] ), dim_company[company_id] ) )

  - table: fact_case_study
    name: "Fall CCC Sektor-Median"
    folder: "Fallstudien"
    format: "0.0"
    description: "CCC Sektor-Median der gewählten Fallstudie (Filter über das Unternehmen, ohne beidseitige Beziehung)."
    expression: |
      CALCULATE ( [CCC Sektor-Median], TREATAS ( VALUES ( fact_case_study[company_id] ), dim_company[company_id] ) )

  - table: fact_case_study
    name: "Fall Rote Flaggen"
    folder: "Fallstudien"
    format: "#,0"
    description: "Rote Flaggen der gewählten Fallstudie (Filter über das Unternehmen, ohne beidseitige Beziehung)."
    expression: |
      CALCULATE ( [Rote Flaggen], TREATAS ( VALUES ( fact_case_study[company_id] ), dim_company[company_id] ) )

  - table: fact_case_study
    name: "Fall Ereignisse"
    folder: "Beschriftungen\\Fallstudien"
    description: "Ereignisse der gewählten Fallstudie bis zur Insolvenz, eines je Zeile (Datum, Art, Formular)."
    expression: |
      VAR _ereignisse = CALCULATETABLE ( fact_event, TREATAS ( VALUES ( fact_case_study[company_id] ), dim_company[company_id] ) )
      RETURN
          CONCATENATEX (
              _ereignisse,
              FORMAT ( fact_event[event_date], "dd.MM.yyyy" ) & "  " & fact_event[event_type] & "  " & fact_event[form],
              UNICHAR ( 10 ),
              fact_event[event_date], ASC
          )

  - table: fact_financial_line
    name: "GuV-Brücke Betrag"
    folder: "GuV"
    format: "#,0"
    unit: Mio
    description: "Vorzeichenrichtige Schritte von Umsatz bis EBIT: Umsatz, minus Umsatzkosten, Rest bis EBIT; ohne Schritt das EBIT (Summe des Wasserfalls)."
    expression: |
      IF (
          HASONEVALUE ( 'GuV-Brücke'[Reihenfolge] ),
          SWITCH (
              VALUES ( 'GuV-Brücke'[Reihenfolge] ),
              1, [Umsatz],
              2, - [COGS],
              3, [EBIT] - ( [Umsatz] - [COGS] )
          ),
          [EBIT]
      )

  - table: fact_hypothesis_result
    name: "Antwort Text"
    folder: "Beschriftungen\\Antwort"
    description: "Ergebnissatz der Hypothese in der Zeile (Tabelle auf der Seite Antwort), Deutsch oder Englisch."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      RETURN IF ( _en, SELECTEDVALUE ( fact_hypothesis_result[text_en] ), SELECTEDVALUE ( fact_hypothesis_result[text_de] ) )

  - table: fact_risk_score
    name: "Risiko Farbe"
    folder: "Beschriftungen\\Farben"
    description: "Hintergrundfarbe des Risikobands (rot ab 10 %, gelb ab 3 %, sonst grün; Schwellen wie analysis/config.py). Rot und Grün nur hier."
    expression: |
      VAR _p = [Risiko 12M]
      RETURN
          SWITCH (
              TRUE (),
              ISBLANK ( _p ), BLANK (),
              _p >= 0.10, "#F4C7C3",
              _p >= 0.03, "#FCE8B2",
              "#C8E6C9"
          )

  - table: fact_wc_opportunity
    name: "Farbe Sektor-Hebel"
    folder: "Beschriftungen\\Farben"
    description: "Akzentfarbe für den Sektor mit dem größten Cash-Potenzial, Grau für die übrigen (Designregel)."
    expression: |
      VAR _alle = CALCULATETABLE ( VALUES ( dim_sector[sector_key] ), ALLSELECTED ( dim_sector ) )
      VAR _top = TOPN ( 1, _alle, CALCULATE ( [Cash-Potenzial aktuell] ), DESC )
      RETURN IF ( SELECTEDVALUE ( dim_sector[sector_key] ) IN _top, "#1F5AA6", "#B3B3B3" )

  - table: fact_risk_score
    name: "Befund Unternehmen"
    folder: "Beschriftungen"
    description: "Kopfzeile der Unternehmensseiten: Unternehmen, Insolvenzrisiko 12 Monate und rote Flaggen, aus den Daten."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _p = [Risiko 12M]
      VAR _flaggen = COALESCE ( [Rote Flaggen], 0 )
      RETURN
          IF ( NOT HASONEVALUE ( dim_company[company_id] ), [Ausgewähltes Unternehmen],
              [Ausgewähltes Unternehmen] & " · "
                  & IF ( _en, "12-month bankruptcy risk ", "Insolvenzrisiko 12 Monate " )
                  & IF ( ISBLANK ( _p ), "n/a", FORMAT ( _p, "0.0%" ) )
                  & " · " & FORMAT ( _flaggen, "#,0" ) & IF ( _en, " red flags", " rote Flaggen" ) )

  - table: fact_hypothesis_result
    name: "Antwort H1"
    folder: "Beschriftungen\\Antwort"
    description: "Ergebnissatz zu H1 Vorlaufzeit aus dem letzten Modelllauf (Deutsch oder Englisch nach Sprache), nie von Hand."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _de = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_de] ), fact_hypothesis_result[hypothesis_code] = "H1" )
      VAR _txt = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_en] ), fact_hypothesis_result[hypothesis_code] = "H1" )
      RETURN IF ( _en, _txt, _de )

  - table: fact_hypothesis_result
    name: "Antwort H2"
    folder: "Beschriftungen\\Antwort"
    description: "Ergebnissatz zu H2 Genauigkeit aus dem letzten Modelllauf (Deutsch oder Englisch nach Sprache), nie von Hand."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _de = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_de] ), fact_hypothesis_result[hypothesis_code] = "H2" )
      VAR _txt = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_en] ), fact_hypothesis_result[hypothesis_code] = "H2" )
      RETURN IF ( _en, _txt, _de )

  - table: fact_hypothesis_result
    name: "Antwort H3"
    folder: "Beschriftungen\\Antwort"
    description: "Ergebnissatz zu H3 Sektorsicht aus dem letzten Modelllauf (Deutsch oder Englisch nach Sprache), nie von Hand."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _de = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_de] ), fact_hypothesis_result[hypothesis_code] = "H3" )
      VAR _txt = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_en] ), fact_hypothesis_result[hypothesis_code] = "H3" )
      RETURN IF ( _en, _txt, _de )

  - table: fact_hypothesis_result
    name: "Antwort H4"
    folder: "Beschriftungen\\Antwort"
    description: "Ergebnissatz zu H4 Euro-Wert aus dem letzten Modelllauf (Deutsch oder Englisch nach Sprache), nie von Hand."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _de = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_de] ), fact_hypothesis_result[hypothesis_code] = "H4" )
      VAR _txt = CALCULATE ( SELECTEDVALUE ( fact_hypothesis_result[text_en] ), fact_hypothesis_result[hypothesis_code] = "H4" )
      RETURN IF ( _en, _txt, _de )

  - table: fact_hypothesis_result
    name: "Hypothesen bestätigt"
    folder: "Antwort"
    format: "#,0"
    description: "Anzahl der Hypothesen H1–H4, die der letzte Lauf bestätigt hat."
    expression: |
      SUM ( fact_hypothesis_result[is_held] )

  - table: fact_lead_time
    name: "Vorlaufzeit CCC (Median)"
    folder: "Antwort"
    format: "0.0"
    description: "Median der Monate zwischen der dauerhaft roten CCC-Flagge und der Insolvenz; nie rot zählt als 0 (wie in H1)."
    expression: |
      MEDIANX ( fact_lead_time, COALESCE ( fact_lead_time[lead_months_ccc], 0 ) )

  - table: fact_lead_time
    name: "Vorlaufzeit Z'' (Median)"
    folder: "Antwort"
    format: "0.0"
    description: "Median der Monate zwischen der dauerhaft roten Z''-Flagge und der Insolvenz; nie rot zählt als 0 (wie in H1)."
    expression: |
      MEDIANX ( fact_lead_time, COALESCE ( fact_lead_time[lead_months_z], 0 ) )

  - table: fact_lead_time
    name: "Anteil CCC-Flagge rot"
    folder: "Antwort"
    format: "0%"
    description: "Anteil der Unternehmen mit Insolvenz, deren CCC-Flagge vor dem Ereignis dauerhaft rot war."
    expression: |
      DIVIDE ( COUNTROWS ( FILTER ( fact_lead_time, NOT ISBLANK ( fact_lead_time[lead_months_ccc] ) ) ), COUNTROWS ( fact_lead_time ) )

  - table: fact_lead_time
    name: "Anteil Z''-Flagge rot"
    folder: "Antwort"
    format: "0%"
    description: "Anteil der Unternehmen mit Insolvenz, deren Z''-Flagge vor dem Ereignis dauerhaft rot war."
    expression: |
      DIVIDE ( COUNTROWS ( FILTER ( fact_lead_time, NOT ISBLANK ( fact_lead_time[lead_months_z] ) ) ), COUNTROWS ( fact_lead_time ) )

  - table: fact_lead_time
    name: "Anteil CCC berechenbar"
    folder: "Antwort"
    format: "0%"
    description: "Anteil der Unternehmen mit Insolvenz, für die die CCC-Flagge an der letzten Beobachtung vor dem Ereignis berechenbar war."
    expression: |
      AVERAGE ( fact_lead_time[ccc_available_last] )

  - table: fact_lead_time
    name: "Insolvenzen mit Kennzahlen"
    folder: "Antwort"
    format: "#,0"
    description: "Unternehmen mit Insolvenz und Kennzahlen vor dem Ereignis (Grundgesamtheit von H1)."
    expression: |
      COUNTROWS ( fact_lead_time )

  - table: fact_model_backtest
    name: "PR-AUC"
    folder: "Modellgüte"
    format: "0.000"
    description: "Fläche unter der Precision-Recall-Kurve im gepoolten Out-of-time-Backtest."
    expression: |
      MAX ( fact_model_backtest[pr_auc] )

  - table: fact_model_backtest
    name: "Recall Top 5 %"
    folder: "Modellgüte"
    format: "0%"
    description: "Anteil der Insolvenzen unter den 5 % Unternehmen mit dem höchsten Score."
    expression: |
      MAX ( fact_model_backtest[recall_top5] )

  - table: fact_model_backtest
    name: "Brier Score"
    folder: "Modellgüte"
    format: "0.0000"
    description: "Mittlerer quadratischer Fehler der Wahrscheinlichkeit (kleiner ist besser)."
    expression: |
      MAX ( fact_model_backtest[brier] )

  - table: fact_wc_opportunity
    name: "Cash-Potenzial aktuell"
    folder: "Working Capital"
    format: "#,0.0"
    unit: Mrd
    description: "Cash-Potenzial im letzten Geschäftsjahr je Unternehmen (wie H4), summiert über die Unternehmen im Kontext."
    expression: |
      SUMX (
          VALUES ( fact_wc_opportunity[company_id] ),
          -- the company's latest fiscal year overall (H4 rule), not the latest within the sector or
          -- filter in context: a company that changed sector is counted once, in its latest sector
          VAR _gj = CALCULATE ( MAX ( fact_wc_opportunity[fiscal_year] ), ALLEXCEPT ( fact_wc_opportunity, fact_wc_opportunity[company_id] ) )
          RETURN CALCULATE ( SUM ( fact_wc_opportunity[cash_opportunity_eur] ), fact_wc_opportunity[fiscal_year] = _gj )
      )

  - table: fact_wc_opportunity
    name: "Cash-Potenzial Stretch aktuell"
    folder: "Working Capital"
    format: "#,0.0"
    unit: Mrd
    description: "Wie Cash-Potenzial aktuell, Ziel ist das 25. Perzentil des Sektors (DPO: 75.)."
    expression: |
      SUMX (
          VALUES ( fact_wc_opportunity[company_id] ),
          -- the company's latest fiscal year overall (H4 rule), not the latest within the sector or
          -- filter in context: a company that changed sector is counted once, in its latest sector
          VAR _gj = CALCULATE ( MAX ( fact_wc_opportunity[fiscal_year] ), ALLEXCEPT ( fact_wc_opportunity, fact_wc_opportunity[company_id] ) )
          RETURN CALCULATE ( SUM ( fact_wc_opportunity[cash_opportunity_stretch_eur] ), fact_wc_opportunity[fiscal_year] = _gj )
      )

  - table: fact_lead_time
    name: "Befund Vorlaufzeit"
    folder: "Beschriftungen"
    description: "Diagrammtitel mit dem Befund zu H1, aus den Daten berechnet."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _z = FORMAT ( [Vorlaufzeit Z'' (Median)], "0.0" )
      VAR _c = FORMAT ( [Vorlaufzeit CCC (Median)], "0.0" )
      RETURN
          IF ( ISBLANK ( [Insolvenzen mit Kennzahlen] ), BLANK (),
              IF ( _en,
                  "Z'' warned a median " & _z & " months before bankruptcy, the CCC flag " & _c,
                  "Z'' warnte im Median " & _z & " Monate vor der Insolvenz, die CCC-Flagge " & _c ) )

  - table: fact_wc_opportunity
    name: "Befund Cash-Potenzial"
    folder: "Beschriftungen"
    description: "Diagrammtitel mit dem größten Working-Capital-Hebel nach Sektor, aus den Daten berechnet."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _top = TOPN ( 1, VALUES ( dim_sector[sector_key] ), [Cash-Potenzial aktuell], DESC )
      VAR _name = IF ( _en, CALCULATE ( SELECTEDVALUE ( dim_sector[sector_en] ), _top ), CALCULATE ( SELECTEDVALUE ( dim_sector[sector_de] ), _top ) )
      VAR _wert = FORMAT ( DIVIDE ( CALCULATE ( [Cash-Potenzial aktuell], _top ), 1e9 ), "#,0.0" )
      RETURN
          IF ( ISBLANK ( [Cash-Potenzial aktuell] ), BLANK (),
              IF ( _en,
                  _name & " has the largest lever: EUR " & _wert & " bn to sector median",
                  _name & " hat den größten Hebel: " & _wert & " Mrd. EUR bis zum Sektormedian" ) )

  - table: fact_model_backtest
    name: "Befund Modellgüte"
    folder: "Beschriftungen"
    description: "Diagrammtitel: bestes Modell nach PR-AUC und sein Abstand zu Z'' allein (M1), aus den Daten berechnet."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _best = TOPN ( 1, VALUES ( fact_model_backtest[model_name] ), [PR-AUC], DESC )
      VAR _name = CALCULATE ( SELECTEDVALUE ( fact_model_backtest[model_name] ), _best )
      VAR _bestauc = CALCULATE ( [PR-AUC], _best )
      VAR _m1 = CALCULATE ( [PR-AUC], fact_model_backtest[model_name] = "M1_logit_z" )
      RETURN
          IF ( ISBLANK ( _bestauc ), BLANK (),
              IF ( _en,
                  _name & " ranks best: PR-AUC " & FORMAT ( _bestauc, "0.000" ) & " against " & FORMAT ( _m1, "0.000" ) & " for Z'' alone",
                  _name & " trennt am besten: PR-AUC " & FORMAT ( _bestauc, "0.000" ) & " gegen " & FORMAT ( _m1, "0.000" ) & " für Z'' allein" ) )

  - table: fact_risk_score
    name: "Befund Frühwarnung"
    folder: "Beschriftungen"
    description: "Diagrammtitel: Unternehmen im roten Band zum jeweils letzten Stichtag je Unternehmen (Champion-Modell), aus den Daten berechnet."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _n = [Unternehmen rot]
      VAR _stichtag = CALCULATE ( MAX ( fact_risk_score[as_of_date] ), fact_risk_score[is_champion] = 1 )
      RETURN
          IF ( ISBLANK ( _stichtag ), BLANK (),
              IF ( _en,
                  FORMAT ( COALESCE ( _n, 0 ), "#,0" ) & " companies in the red band at their latest score (up to " & FORMAT ( _stichtag, "yyyy-MM-dd" ) & ")",
                  FORMAT ( COALESCE ( _n, 0 ), "#,0" ) & " Unternehmen im roten Band zum jeweils letzten Stichtag (bis " & FORMAT ( _stichtag, "dd.MM.yyyy" ) & ")" ) )

  - table: fact_data_quality
    name: "Befund Datenqualität"
    folder: "Beschriftungen"
    description: "Diagrammtitel: Pass-Rate der Prüfregeln im letzten Lauf gegen das Ziel, aus den Daten berechnet."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _rate = [DQ Pass-Rate]
      VAR _verletzt = [Regeln verletzt]
      RETURN
          IF ( ISBLANK ( _rate ), BLANK (),
              IF ( _en,
                  FORMAT ( _rate, "0.0%" ) & " of checks passed; " & FORMAT ( COALESCE ( _verletzt, 0 ), "#,0" ) & " rules violated",
                  FORMAT ( _rate, "0.0%" ) & " der Prüfungen bestanden; " & FORMAT ( COALESCE ( _verletzt, 0 ), "#,0" ) & " Regeln verletzt" ) )

  - table: dim_company
    name: "Ausgewähltes Unternehmen"
    folder: "Beschriftungen"
    description: "Name des gewählten Unternehmens für Diagrammtitel der Unternehmensseiten."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      RETURN
          IF ( HASONEVALUE ( dim_company[company_id] ),
              SELECTEDVALUE ( dim_company[company_name] ),
              IF ( _en, "All companies (pick one)", "Alle Unternehmen (bitte eines wählen)" ) )

  - table: fact_case_study
    name: "Befund Fallstudie"
    folder: "Beschriftungen"
    description: "Titel der Fallstudie: Unternehmen, Ereignisdatum und Vorlaufzeiten beider Flaggen, aus den Daten."
    expression: |
      VAR _en = SELECTEDVALUE ( Sprache[Code], "DE" ) = "EN"
      VAR _name = SELECTEDVALUE ( fact_case_study[company_name] )
      VAR _datum = SELECTEDVALUE ( fact_case_study[event_date] )
      VAR _z = SELECTEDVALUE ( fact_case_study[lead_months_z] )
      VAR _c = SELECTEDVALUE ( fact_case_study[lead_months_ccc] )
      VAR _zt = IF ( ISBLANK ( _z ), IF ( _en, "never red", "nie rot" ), FORMAT ( _z, "0.0" ) & IF ( _en, " months ahead", " Monate vorher" ) )
      VAR _ct = IF ( ISBLANK ( _c ), IF ( _en, "never red", "nie rot" ), FORMAT ( _c, "0.0" ) & IF ( _en, " months ahead", " Monate vorher" ) )
      RETURN
          IF ( ISBLANK ( _name ), IF ( _en, "Pick a case study", "Bitte eine Fallstudie wählen" ),
              _name & IF ( _en, ", bankruptcy ", ", Insolvenz " ) & FORMAT ( _datum, IF ( _en, "yyyy-MM-dd", "dd.MM.yyyy" ) )
                  & " · Z'': " & _zt & " · CCC: " & _ct )

  - table: fact_financial_line
    name: "_Betrag Roh"
    folder: "_Basis"
    format: "#,0"
    hidden: true
    description: "Summe in der gewählten Währung (Berechnungsgruppe Währung). Landeswährung nur bei genau einer Währung im Kontext."
    expression: |
      VAR _waehrung = SELECTEDVALUE ( 'Währung'[Währung], "EUR" )
      RETURN
          IF (
              _waehrung = "EUR",
              SUM ( fact_financial_line[amount_eur] ),
              IF ( HASONEVALUE ( dim_currency[currency_code] ), SUM ( fact_financial_line[amount_local] ) )
          )

  - table: fact_financial_line
    name: "_Betrag Szenario"
    folder: "_Basis"
    format: "#,0"
    hidden: true
    description: "Ohne Szenarioauswahl gilt Ist."
    expression: |
      IF (
          ISFILTERED ( dim_scenario[scenario_code] ),
          [_Betrag Roh],
          CALCULATE ( [_Betrag Roh], dim_scenario[scenario_code] = "IST" )
      )

  - table: fact_financial_line
    name: "Betrag"
    folder: "_Basis"
    format: "#,0"
    hidden: true
    description: "Basismessung aller Finanzzeilen. Ohne Auswahl gelten Szenario Ist und Version latest (nach Restatements); die Seite Datenqualität vergleicht mit first_reported."
    expression: |
      IF (
          ISFILTERED ( fact_financial_line[version] ),
          [_Betrag Szenario],
          CALCULATE ( [_Betrag Szenario], fact_financial_line[version] = "latest" )
      )

  - table: fact_financial_line
    name: "Bestand"
    folder: "_Basis"
    format: "#,0"
    unit: Mio
    hidden: true
    description: "Bilanzwert zum letzten Periodenende jedes Unternehmens im Kontext (Stichtagswert, nicht summiert über Quartale)."
    expression: |
      SUMX (
          VALUES ( dim_company[company_id] ),
          VAR _letzter = CALCULATE ( MAX ( fact_financial_line[period_end_date] ) )
          RETURN CALCULATE ( [Betrag], dim_date[date_key] = _letzter )
      )

  - table: fact_financial_line
    name: "Umsatz"
    folder: "GuV"
    format: "#,0"
    unit: Mio
    description: "Umsatzerlöse (Position REV), Summe der Quartale im Kontext."
    expression: |
      CALCULATE ( [Betrag], dim_line_item[line_item_code] = "REV" )

  - table: fact_financial_line
    name: "COGS"
    folder: "GuV"
    format: "#,0"
    unit: Mio
    description: "Umsatzkosten (Position COGS)."
    expression: |
      CALCULATE ( [Betrag], dim_line_item[line_item_code] = "COGS" )

  - table: fact_financial_line
    name: "EBIT"
    folder: "GuV"
    format: "#,0"
    unit: Mio
    description: "Betriebsergebnis (Position EBIT)."
    expression: |
      CALCULATE ( [Betrag], dim_line_item[line_item_code] = "EBIT" )

  - table: fact_financial_line
    name: "Jahresergebnis"
    folder: "GuV"
    format: "#,0"
    unit: Mio
    description: "Jahresergebnis der Anteilseigner (Position NI)."
    expression: |
      CALCULATE ( [Betrag], dim_line_item[line_item_code] = "NI" )

  - table: fact_financial_line
    name: "EBIT-Marge"
    folder: "GuV"
    format: "0.0%"
    description: "EBIT geteilt durch Umsatz."
    expression: |
      DIVIDE ( [EBIT], [Umsatz] )

  - table: fact_financial_line
    name: "Bruttomarge"
    folder: "GuV"
    format: "0.0%"
    description: "(Umsatz minus Umsatzkosten) geteilt durch Umsatz."
    expression: |
      DIVIDE ( [Umsatz] - [COGS], [Umsatz] )

  - table: fact_financial_line
    name: "Umsatz TTM"
    folder: "GuV"
    format: "#,0"
    unit: Mio
    description: "Umsatz der letzten zwölf Monate (Element TTM der Berechnungsgruppe Zeitintelligenz); braucht einen Datumskontext aus dim_date, im Geschäftsjahr-Kontext von dim_period leer."
    expression: |
      CALCULATE ( [Umsatz], Zeitintelligenz[Zeit] = "TTM" )

  - table: fact_financial_line
    name: "COGS TTM"
    folder: "GuV"
    format: "#,0"
    unit: Mio
    description: "Umsatzkosten der letzten zwölf Monate; braucht wie Umsatz TTM einen Datumskontext aus dim_date."
    expression: |
      CALCULATE ( [COGS], Zeitintelligenz[Zeit] = "TTM" )

  - table: fact_financial_line
    name: "Bilanzsumme"
    folder: "Bilanz"
    format: "#,0"
    unit: Mio
    description: "Bilanzsumme Aktiva zum Stichtag."
    expression: |
      CALCULATE ( [Bestand], dim_line_item[line_item_code] = "TA" )

  - table: fact_financial_line
    name: "Eigenkapital"
    folder: "Bilanz"
    format: "#,0"
    unit: Mio
    description: "Eigenkapital gesamt zum Stichtag."
    expression: |
      CALCULATE ( [Bestand], dim_line_item[line_item_code] = "EQ" )

  - table: fact_financial_line
    name: "Verbindlichkeiten"
    folder: "Bilanz"
    format: "#,0"
    unit: Mio
    description: "Verbindlichkeiten gesamt zum Stichtag."
    expression: |
      CALCULATE ( [Bestand], dim_line_item[line_item_code] = "TL" )

  - table: fact_financial_line
    name: "Eigenkapitalquote"
    folder: "Bilanz"
    format: "0.0%"
    description: "Eigenkapital geteilt durch Bilanzsumme, aus fact_kpi (dbt, je Stichtag), letzte Version. Die Summen der Bilanzzeilen über ein Geschäftsjahr mischten Stichtage mit und ohne Bilanzsumme (Microsoft 2009: 190 %)."
    expression: |
      CALCULATE ( [KPI Wert], dim_kpi[kpi_code] = "EQUITY_RATIO" )

  - table: fact_financial_line
    name: "Verschuldungsgrad"
    folder: "Bilanz"
    format: "0.00"
    description: "Verbindlichkeiten geteilt durch Eigenkapital."
    expression: |
      DIVIDE ( [Verbindlichkeiten], [Eigenkapital] )

  - table: fact_financial_line
    name: "Liquide Mittel"
    folder: "Bilanz"
    format: "#,0"
    unit: Mio
    description: "Liquide Mittel zum Stichtag."
    expression: |
      CALCULATE ( [Bestand], dim_line_item[line_item_code] = "CASH" )

  - table: fact_financial_line
    name: "Operativer Cashflow"
    folder: "Cashflow"
    format: "#,0"
    unit: Mio
    description: "Cashflow aus laufender Geschäftstätigkeit."
    expression: |
      CALCULATE ( [Betrag], dim_line_item[line_item_code] = "CFO" )

  - table: fact_financial_line
    name: "Cash Conversion (CFO / EBIT)"
    folder: "Cashflow"
    format: "0.0%"
    description: "Operativer Cashflow geteilt durch EBIT."
    expression: |
      DIVIDE ( [Operativer Cashflow], [EBIT] )

  - table: fact_financial_line
    name: "Forderungen Durchschnitt"
    folder: "Working Capital"
    format: "#,0"
    unit: Mio
    description: "Durchschnitt der Forderungen aus Lieferungen und Leistungen über die Perioden im Kontext."
    expression: |
      AVERAGEX (
          VALUES ( dim_period[period_key] ),
          CALCULATE ( [Betrag], dim_line_item[line_item_code] = "AR" )
      )

  - table: fact_financial_line
    name: "Vorräte Durchschnitt"
    folder: "Working Capital"
    format: "#,0"
    unit: Mio
    description: "Durchschnitt der Vorräte."
    expression: |
      AVERAGEX (
          VALUES ( dim_period[period_key] ),
          CALCULATE ( [Betrag], dim_line_item[line_item_code] = "INV" )
      )

  - table: fact_financial_line
    name: "Verbindlichkeiten LuL Durchschnitt"
    folder: "Working Capital"
    format: "#,0"
    unit: Mio
    description: "Durchschnitt der Verbindlichkeiten aus Lieferungen und Leistungen."
    expression: |
      AVERAGEX (
          VALUES ( dim_period[period_key] ),
          CALCULATE ( [Betrag], dim_line_item[line_item_code] = "AP" )
      )

  - table: fact_financial_line
    name: "DSO"
    folder: "Working Capital"
    format: "0.0"
    description: "Days Sales Outstanding aus fact_kpi (dbt: Forderungen / Umsatz TTM * 365, Point-in-time je Periode), letzte Version."
    expression: |
      CALCULATE ( [KPI Wert], dim_kpi[kpi_code] = "DSO" )

  - table: fact_financial_line
    name: "DIO"
    folder: "Working Capital"
    format: "0.0"
    description: "Days Inventory Outstanding aus fact_kpi (dbt: Vorräte / COGS TTM * 365), letzte Version."
    expression: |
      CALCULATE ( [KPI Wert], dim_kpi[kpi_code] = "DIO" )

  - table: fact_financial_line
    name: "DPO"
    folder: "Working Capital"
    format: "0.0"
    description: "Days Payables Outstanding aus fact_kpi (dbt: Verbindlichkeiten LuL / COGS TTM * 365), letzte Version."
    expression: |
      CALCULATE ( [KPI Wert], dim_kpi[kpi_code] = "DPO" )

  - table: fact_financial_line
    name: "CCC"
    folder: "Working Capital"
    format: "0.0"
    description: "Cash Conversion Cycle in Tagen (DSO + DIO - DPO) aus fact_kpi, letzte Version; dieselbe Zahl wie in H1 und der Watchlist."
    expression: |
      CALCULATE ( [KPI Wert], dim_kpi[kpi_code] = "CCC" )

  - table: fact_kpi
    name: "CCC Sektor-Median"
    folder: "Working Capital"
    format: "0.0"
    description: "Median des CCC über die Unternehmen mit CCC zwischen -730 und 730 Tagen im Sektor der Unternehmen im Kontext (aus fact_kpi, letzte Version); leer bei weniger als fünf solchen Unternehmen."
    expression: |
      -- the sector of the companies in context (dim_sector is not filtered by a company pick,
      -- the relationship runs from dim_company to dim_sector); MEDIANX only over companies that
      -- have a CCC within the display bounds of page 6 (-730 to 730 days); fewer than five such
      -- peers (dbt var wc_min_sector_peers) give no median
      VAR _sektoren = VALUES ( dim_company[sector_key] )
      RETURN
          CALCULATE (
              VAR _peers =
                  FILTER (
                      ADDCOLUMNS ( VALUES ( dim_company[company_key] ), "@ccc", [KPI Wert] ),
                      NOT ISBLANK ( [@ccc] ) && [@ccc] >= -730 && [@ccc] <= 730
                  )
              RETURN IF ( COUNTROWS ( _peers ) >= 5, MEDIANX ( _peers, [@ccc] ) ),
              REMOVEFILTERS ( dim_company ),
              TREATAS ( _sektoren, dim_company[sector_key] ),
              dim_kpi[kpi_code] = "CCC"
          )

  - table: fact_wc_opportunity
    name: "Cash-Potenzial"
    folder: "Working Capital"
    format: "#,0.0"
    unit: Mrd
    description: "Freisetzbare Liquidität in EUR, wenn DSO und DIO auf den Sektormedian sinken und DPO auf ihn steigt."
    expression: |
      SUM ( fact_wc_opportunity[cash_opportunity_eur] )

  - table: fact_wc_opportunity
    name: "Cash-Potenzial Stretch"
    folder: "Working Capital"
    format: "#,0.0"
    unit: Mrd
    description: "Wie Cash-Potenzial, Ziel ist das 25. Perzentil des Sektors (DPO: 75.)."
    expression: |
      SUM ( fact_wc_opportunity[cash_opportunity_stretch_eur] )

  - table: fact_kpi
    name: "KPI Wert"
    folder: "Kennzahlen"
    format: "0.00"
    description: "Durchschnittlicher Kennzahlenwert im Kontext (letzte Version, nach Restatements)."
    expression: |
      CALCULATE ( AVERAGE ( fact_kpi[value] ), fact_kpi[version] = "latest" )

  - table: fact_kpi
    name: "KPI Wert erstveröffentlicht"
    folder: "Kennzahlen"
    format: "0.00"
    description: "Kennzahlenwert aus den erstveröffentlichten Zahlen (Point-in-time, Grundlage des Modells)."
    expression: |
      CALCULATE ( AVERAGE ( fact_kpi[value] ), fact_kpi[version] = "first_reported" )

  - table: fact_kpi
    name: "Sektorperzentil"
    folder: "Kennzahlen"
    format: "0%"
    description: "Perzentil der Kennzahl innerhalb von Sektor und Jahr."
    expression: |
      CALCULATE ( AVERAGE ( fact_kpi[sector_percentile] ), fact_kpi[version] = "latest" )

  - table: fact_kpi
    name: "Rote Flaggen"
    folder: "Kennzahlen"
    format: "#,0"
    description: "Anzahl roter Flaggen (Schwelle laut dim_kpi)."
    expression: |
      CALCULATE ( SUM ( fact_kpi[red_flag] ), fact_kpi[version] = "latest" )

  - table: fact_kpi
    name: "Z'' Score"
    folder: "Kreditrisiko"
    format: "0.00"
    description: "Altman Z'' (1995) für Nicht-Produzenten. Unter 1,1 Distress-Zone, über 2,6 sichere Zone."
    expression: |
      CALCULATE ( [KPI Wert], dim_kpi[kpi_code] = "ZPP" )

  - table: fact_risk_score
    name: "Risiko 12M"
    folder: "Kreditrisiko"
    format: "0.0%"
    description: "Durchschnittliche kalibrierte Insolvenzwahrscheinlichkeit in 12 Monaten, Champion-Modell (ADR-007), zum letzten Stichtag je Unternehmen im Kontext (die Stichtage unterscheiden sich je Unternehmen)."
    expression: |
      -- one (company, latest as-of date) pair per company: a single latest date across the
      -- context would keep only the few companies scored on exactly that day
      -- one company in context (table rows, company pages): its latest date is a plain filter
      IF (
          HASONEVALUE ( dim_company[company_id] ),
          VAR _stichtag = CALCULATE ( MAX ( fact_risk_score[as_of_date] ), fact_risk_score[is_champion] = 1 )
          RETURN
              CALCULATE (
                  AVERAGE ( fact_risk_score[probability_12m] ),
                  fact_risk_score[is_champion] = 1,
                  fact_risk_score[as_of_date] = _stichtag
              ),
          VAR _letzte =
              CALCULATETABLE (
                  ADDCOLUMNS ( VALUES ( fact_risk_score[company_id] ), "@stichtag", CALCULATE ( MAX ( fact_risk_score[as_of_date] ) ) ),
                  fact_risk_score[is_champion] = 1
              )
          RETURN
              CALCULATE (
                  AVERAGE ( fact_risk_score[probability_12m] ),
                  TREATAS ( _letzte, fact_risk_score[company_id], fact_risk_score[as_of_date] ),
                  fact_risk_score[is_champion] = 1
              )
      )

  - table: fact_risk_score
    name: "Unternehmen rot"
    folder: "Kreditrisiko"
    format: "#,0"
    description: "Anzahl Unternehmen im roten Risikoband (Champion-Modell, letzter Stichtag je Unternehmen im Kontext)."
    expression: |
      VAR _letzte =
          CALCULATETABLE (
              ADDCOLUMNS ( VALUES ( fact_risk_score[company_id] ), "@stichtag", CALCULATE ( MAX ( fact_risk_score[as_of_date] ) ) ),
              fact_risk_score[is_champion] = 1
          )
      RETURN
          CALCULATE (
              DISTINCTCOUNT ( fact_risk_score[company_id] ),
              TREATAS ( _letzte, fact_risk_score[company_id], fact_risk_score[as_of_date] ),
              fact_risk_score[is_champion] = 1,
              fact_risk_score[risk_band] = "red"
          ) + 0

  - table: fact_risk_score
    name: "Risiko Veränderung zum Vorquartal"
    folder: "Kreditrisiko"
    format: "+0.0%;-0.0%"
    description: "Risiko 12M minus Risiko 12M drei Monate früher."
    expression: |
      [Risiko 12M] - CALCULATE ( [Risiko 12M], DATEADD ( dim_date[date_key], -3, MONTH ) )

  - table: fact_event
    name: "Insolvenzen"
    folder: "Kreditrisiko"
    format: "#,0"
    description: "Anzahl Insolvenzereignisse (8-K Item 1.03)."
    expression: |
      CALCULATE ( COUNTROWS ( fact_event ), fact_event[event_type] = "BANKRUPTCY_8K_103" )

  - table: fact_financial_line
    name: "Prognosefehler WAPE"
    folder: "Plan-Ist"
    format: "0.0%"
    description: "Gewichteter absoluter Prognosefehler: Summe |Ist - Forecast| geteilt durch Summe |Ist| über Unternehmen und Quartale im Kontext. Anders als ein einfacher MAPE dominieren Unternehmen mit sehr kleinem Umsatz das Ergebnis nicht."
    expression: |
      VAR _paare =
          FILTER (
              ADDCOLUMNS (
                  SUMMARIZE ( fact_financial_line, dim_company[company_key], dim_period[period_key] ),
                  "@ist", CALCULATE ( [Umsatz], dim_scenario[scenario_code] = "IST" ),
                  "@fc", CALCULATE ( [Umsatz], dim_scenario[scenario_code] = "FC" )
              ),
              NOT ISBLANK ( [@fc] ) && NOT ISBLANK ( [@ist] )
          )
      RETURN DIVIDE ( SUMX ( _paare, ABS ( [@ist] - [@fc] ) ), SUMX ( _paare, ABS ( [@ist] ) ) )

  - table: fact_financial_line
    name: "Datenstand"
    folder: "Datenqualität"
    format: "dd.MM.yyyy"
    description: "Letzter Veröffentlichungszeitpunkt (available_at) aller Werte im Modell, unabhängig von Filtern. Für Fußzeilen und das Excel-Cockpit."
    expression: |
      CALCULATE ( MAX ( fact_financial_line[available_at] ), REMOVEFILTERS () )

  - table: fact_data_quality
    name: "DQ Pass-Rate"
    folder: "Datenqualität"
    format: "0.0%"
    description: "Bestandene Prüfungen geteilt durch geprüfte Zeilen im letzten Lauf."
    expression: |
      VAR _lauf = CALCULATE ( MAX ( fact_data_quality[run_at] ), REMOVEFILTERS ( fact_data_quality ) )
      RETURN
          CALCULATE (
              DIVIDE ( SUM ( fact_data_quality[rows_checked] ) - SUM ( fact_data_quality[rows_failed] ), SUM ( fact_data_quality[rows_checked] ) ),
              fact_data_quality[run_at] = _lauf
          )

  - table: fact_data_quality
    name: "DQ Ziel"
    folder: "Datenqualität"
    format: "0.0%"
    description: "Ziel-Pass-Rate der Regel im letzten Lauf."
    expression: |
      VAR _lauf = CALCULATE ( MAX ( fact_data_quality[run_at] ), REMOVEFILTERS ( fact_data_quality ) )
      RETURN CALCULATE ( MAX ( fact_data_quality[target_pass_rate] ), fact_data_quality[run_at] = _lauf )

  - table: fact_data_quality
    name: "DQ Status"
    folder: "Beschriftungen\\Datenqualität"
    description: "Status der Regel im letzten Lauf (pass, fail, info, no_data); leer für Regeln, die der letzte Lauf nicht geprüft hat."
    expression: |
      VAR _lauf = CALCULATE ( MAX ( fact_data_quality[run_at] ), REMOVEFILTERS ( fact_data_quality ) )
      RETURN CALCULATE ( SELECTEDVALUE ( fact_data_quality[status] ), fact_data_quality[run_at] = _lauf )

  - table: fact_data_quality
    name: "Regeln verletzt"
    folder: "Datenqualität"
    format: "#,0"
    description: "Anzahl Regeln mit Status fail im letzten Lauf."
    expression: |
      VAR _lauf = CALCULATE ( MAX ( fact_data_quality[run_at] ), REMOVEFILTERS ( fact_data_quality ) )
      RETURN CALCULATE ( COUNTROWS ( fact_data_quality ), fact_data_quality[run_at] = _lauf, fact_data_quality[status] = "fail" )

  - table: dim_company
    name: "LEI-Match-Quote"
    folder: "Stammdaten"
    format: "0.0%"
    description: "Anteil der aktuellen SEC-Unternehmen (mit CIK) mit LEI."
    expression: |
      -- SEC companies only: LEI-only ESEF issuers carry an LEI by construction
      DIVIDE (
          CALCULATE ( COUNTROWS ( dim_company ), dim_company[is_current] = 1, dim_company[is_lei_matched] = 1, NOT ISBLANK ( dim_company[cik] ) ),
          CALCULATE ( COUNTROWS ( dim_company ), dim_company[is_current] = 1, NOT ISBLANK ( dim_company[cik] ) )
      )

  - table: fact_stewardship_queue
    name: "Offene Stewardship-Fälle"
    folder: "Stammdaten"
    format: "#,0"
    description: "Kandidatenpaare zwischen den Schwellen ohne Entscheidung."
    expression: |
      COUNTROWS ( fact_stewardship_queue )

  - table: fact_kpi
    name: "Restatement-Quote"
    folder: "Datenqualität"
    format: "0.0%"
    description: "Anteil der Kennzahlenwerte (letzte Version), die um mehr als 0,5 % von der Erstveröffentlichung abweichen."
    expression: |
      -- fact_kpi[is_restated] is set in dbt on both rows of a pair (latest differs from first
      -- reported by more than 0.5 %), so the measure is a filtered count in the storage engine
      DIVIDE (
          CALCULATE ( COUNTROWS ( fact_kpi ), fact_kpi[version] = "latest", fact_kpi[is_restated] = 1 ),
          CALCULATE ( COUNTROWS ( fact_kpi ), fact_kpi[version] = "latest" )
      )

calculation_groups:
  - name: Zeitintelligenz
    column: Zeit
    precedence: 10
    description: "Ist, Vorjahr, Abweichung zum Vorjahr, YTD, TTM."
    items:
      - [Ist, "SELECTEDMEASURE ()"]
      - [Vorjahr, "CALCULATE ( SELECTEDMEASURE (), DATEADD ( dim_date[date_key], -1, YEAR ) )"]
      - [Abweichung zum Vorjahr, "SELECTEDMEASURE () - CALCULATE ( SELECTEDMEASURE (), DATEADD ( dim_date[date_key], -1, YEAR ) )"]
      - [Abweichung zum Vorjahr %, "DIVIDE ( SELECTEDMEASURE () - CALCULATE ( SELECTEDMEASURE (), DATEADD ( dim_date[date_key], -1, YEAR ) ), ABS ( CALCULATE ( SELECTEDMEASURE (), DATEADD ( dim_date[date_key], -1, YEAR ) ) ) )", "0.0%"]
      - [YTD, "CALCULATE ( SELECTEDMEASURE (), DATESYTD ( dim_date[date_key] ) )"]
      - [TTM, "CALCULATE ( SELECTEDMEASURE (), DATESINPERIOD ( dim_date[date_key], MAX ( dim_date[date_key] ), -12, MONTH ) )"]
  - name: Szenario
    column: Szenario
    precedence: 20
    description: "Ist, Plan, Plan-Ist-Abweichung absolut und in Prozent, Forecast."
    items:
      - [Ist, "CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"IST\" )"]
      - [Plan, "CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"PLAN\" )"]
      - [Plan-Ist-Abweichung, "CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"IST\" ) - CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"PLAN\" )"]
      - [Plan-Ist-Abweichung %, "DIVIDE ( CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"IST\" ) - CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"PLAN\" ), ABS ( CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"PLAN\" ) ) )", "0.0%"]
      - [Forecast, "CALCULATE ( SELECTEDMEASURE (), dim_scenario[scenario_code] = \"FC\" )"]
  - name: Währung
    column: Währung
    precedence: 30
    description: "EUR oder Landeswährung. Die Basismessung [Betrag] liest die Auswahl; Landeswährung nur bei einer Währung im Kontext."
    items:
      - [EUR, "SELECTEDMEASURE ()"]
      - [Lokal, "SELECTEDMEASURE ()"]

static_tables:
  - name: GuV-Brücke
    description: "Schritte der GuV-Brücke von Umsatz bis EBIT (Seite GuV und Margen, Wasserfall)."
    columns:
      - {name: Schritt, type: string, sort_by: Reihenfolge}
      - {name: Reihenfolge, type: int64, hidden: true}
    rows:
      - ["Umsatz", 1]
      - ["Umsatzkosten", 2]
      - ["Übrige betriebliche Aufwendungen und Erträge", 3]

# Display bounds of the peer scatter ([<name> Wert]): values outside are left out as implausible
# (days as in fact_wc_opportunity, equity ratio as the rule VALID_EQUITY_RATIO_BOUNDS).
peer_bounds: &peer_bounds
  DSO: [0, 730]
  DIO: [0, 730]
  DPO: [0, 730]
  CCC: [-730, 730]
  EBIT-Marge: [-2, 1]
  Bruttomarge: [-2, 1]
  Eigenkapitalquote: [-5, 1]
  "Z'' Score": [-20, 20]
  Verschuldungsgrad: [-50, 50]

# fact_kpi code of each peer measure, for the sector percentile of the selected ratio
# (Verschuldungsgrad has none: EQ_TL is its inverse, so its percentile stays empty).
peer_kpi_codes: &peer_kpi_codes
  DSO: DSO
  DIO: DIO
  DPO: DPO
  CCC: CCC
  EBIT-Marge: EBIT_MARGIN
  Eigenkapitalquote: EQUITY_RATIO
  "Z'' Score": ZPP
  Bruttomarge: GROSS_MARGIN

field_parameters:
  - name: KPI-Auswahl
    description: "Feldparameter für den Peer-Vergleich: wählt die Kennzahl auf Achsen und in Tabellen."
    measures: [DSO, DIO, DPO, CCC, EBIT-Marge, Eigenkapitalquote, Z'' Score, Bruttomarge, Verschuldungsgrad]
    bounds: *peer_bounds
    kpi_codes: *peer_kpi_codes
  - name: KPI-Auswahl Y
    description: "Zweiter Feldparameter für den Peer-Vergleich: die Kennzahl auf der y-Achse des Streudiagramms."
    measures: [EBIT-Marge, DSO, DIO, DPO, CCC, Eigenkapitalquote, Z'' Score, Bruttomarge, Verschuldungsgrad]
    bounds: *peer_bounds
    kpi_codes: *peer_kpi_codes

roles:
  - name: Sektor-Team
    description: "Zeilenebene: nur die Sektoren, die dem Benutzer in sector_team_users zugeordnet sind."
    permission: read
    filters:
      dim_sector: "[sector_code] IN CALCULATETABLE ( VALUES ( sector_team_users[sector_code] ), sector_team_users[user_principal_name] = USERPRINCIPALNAME () )"
  - name: Reporting
    description: "Objektebene: die Modelltreiber (SHAP-Treiber) sind für Reporting-Nutzer unsichtbar."
    permission: read
    ols:
      fact_risk_score: [top_3_drivers]
